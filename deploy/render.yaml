services:
  - type: web
    name: sellable
    runtime: python
    buildCommand: pip install -r apps/api/requirements.txt
    startCommand: uvicorn apps.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: MISSION_HMAC_KEY
        sync: false
      - key: USER_MANDATE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: APP_API_KEY
        sync: false
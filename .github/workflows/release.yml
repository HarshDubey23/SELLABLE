name: Release

# Push a tag like v2.0.0 and this builds the package, checks that the tag,
# pyproject.toml and the MCP server agree on the version, installs the wheel
# into a clean environment, publishes to PyPI and cuts a GitHub release whose
# notes are that version's CHANGELOG section.
#
# Publishing uses PyPI Trusted Publishing (OIDC): there is no API token in
# this repository. One-time setup on pypi.org -> Publishing -> add a pending
# publisher: project "sellable-mcp", owner "HarshDubey23", repo "SELLABLE",
# workflow "release.yml", environment "pypi".
#
# On pull requests that touch packaging, only the build-and-check job runs.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - pyproject.toml
      - mcp_server/**
      - CHANGELOG.md
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and check the distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Versions must agree
        shell: bash
        run: |
          py_ver=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          srv_ver=$(python -c "import re;print(re.search(r'\"version\": \"([^\"]+)\"', open('mcp_server/server.py').read()).group(1))")
          echo "pyproject=$py_ver server=$srv_ver ref=$GITHUB_REF_NAME"
          [ "$py_ver" = "$srv_ver" ] || { echo "::error::pyproject.toml ($py_ver) and mcp_server/server.py ($srv_ver) disagree"; exit 1; }
          grep -q "^## \[$py_ver\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no section for $py_ver"; exit 1; }
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            [ "$GITHUB_REF_NAME" = "v$py_ver" ] || { echo "::error::tag $GITHUB_REF_NAME does not match version $py_ver"; exit 1; }
          fi

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*

      - name: Install the wheel into a clean environment and run it
        shell: bash
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          cd /tmp
          /tmp/smoke/bin/sellable-mcp --help
          /tmp/smoke/bin/python -c "import mcp_server.server as s; print(s.SERVER_INFO)"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/sellable-mcp/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Release notes from CHANGELOG.md
        shell: bash
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v v="$ver" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && (/^## \[/ || /^\[[^]]+\]: /) {exit} on' CHANGELOG.md > notes.md
          test -s notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag

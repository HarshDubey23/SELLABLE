name: CI & Zero-Excuse Reliability Gate
on: [push, pull_request]

jobs:
  test:
    name: Build & Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Runtime & Dev Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt -r apps/api/requirements-dev.txt

      - name: Run Doctor Preflight Audit
        run: python scripts/doctor.py

      - name: Run Pytest Test Suite
        run: python -m pytest -q

      - name: Gateway Purity & Static Analysis
        run: |
          ruff check apps/api/gateway/
          mypy --strict apps/api/gateway/

      - name: Run Master Verification Gate
        run: python scripts/final_verify.py --strict

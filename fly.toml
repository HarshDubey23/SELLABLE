app = "sellable"
primary_region = "iad"

[build]
  use = "dockerfile"
  dockerfile = "Dockerfile"

[env]
  # The app calls OpenRouter; with no key it falls back to a
  # deterministic picker that holds no money authority either way.
  OPENROUTER_MODEL = "openai/gpt-4o-mini"

[deploy]
  health_check_http = "/health"
  health_check_grace_period = 30
  auto_rollback = true

[[services]]
  name = "sellable"
  public = true
  routes = [{ port = 8000 }]
  processes = ["app"]

[processes]
  app = "uvicorn apps.api.main:app --host 0.0.0.0 --port 8000"
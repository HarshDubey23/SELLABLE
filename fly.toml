app = "sellable"
primary_region = "iad"

[build]
  use = "dockerfile"
  dockerfile = "Dockerfile"

[env]
  GEMINI_MODEL = "gemini-3.6-flash"

[deploy]
  health_check_http = "/health"
  health_check_grace_period = 30
  auto_rollback = true

[[services]]
  name = "sellable"
  public = true
  routes = [{ port = 8000 }]
  processes = ["app"]

[processes]
  app = "uvicorn apps.api.main:app --host 0.0.0.0 --port 8000"
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "E402", "E702", "B904"]

[tool.mypy]
strict = true
files = ["apps/api/gateway/"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sellable-mcp"
version = "2.0.0"
description = "MCP server: an AI shopping agent that structurally cannot spend your money"
readme = "mcp_server/README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Harsh Dubey", email = "harshimp123455@gmail.com" }]
keywords = ["mcp", "mcp-server", "ai-agents", "agentic-commerce", "prompt-injection", "llm-security", "payments"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Office/Business :: Financial :: Point-Of-Sale",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/HarshDubey23/SELLABLE"
Documentation = "https://github.com/HarshDubey23/SELLABLE/tree/main/docs"
Source = "https://github.com/HarshDubey23/SELLABLE"
Issues = "https://github.com/HarshDubey23/SELLABLE/issues"
Changelog = "https://github.com/HarshDubey23/SELLABLE/blob/main/CHANGELOG.md"
"Live sandbox" = "https://sellable-mcp.onrender.com"

[project.scripts]
sellable-mcp = "mcp_server.server:main"

[tool.setuptools.packages.find]
include = ["mcp_server*", "apps", "apps.api", "apps.api.gateway", "apps.api.negotiation"]

[tool.setuptools]
py-modules = []

[tool.setuptools.package-data]
mcp_server = ["landing.html"]

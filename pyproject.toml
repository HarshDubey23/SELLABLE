[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "E402", "E702", "B904"]

[tool.mypy]
strict = true
files = ["apps/api/gateway/"]

[tool.pytest.ini_options]
testpaths = ["tests/gateway", "tests/invariants", "tests/test_upsell.py"]

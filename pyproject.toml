[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "E402", "E702", "B904"]

[tool.mypy]
strict = true
files = ["apps/api/gateway/"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sellable-mcp"
version = "2.0.0"
description = "MCP server: an AI shopping agent that structurally cannot spend your money"
readme = "mcp_server/README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
sellable-mcp = "mcp_server.server:main"

[tool.setuptools.packages.find]
include = ["mcp_server*", "apps", "apps.api", "apps.api.gateway", "apps.api.negotiation"]

[tool.setuptools]
py-modules = []

[tool.setuptools.package-data]
mcp_server = ["landing.html"]
